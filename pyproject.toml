[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-serving"
version = "0.1.0"
description = "Unified FastAPI-style inference architecture for classification, segmentation, and detection models with validation, model registry metadata, tests, and CI."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "PyYAML>=6.0", "torch>=2.2", "fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
vision-serving = "vision_serving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
